# Alembic configuration.
#
# NOTE: this file must stay ASCII-only. Alembic reads it with
# configparser(encoding="locale"), and on a zh-CN Windows box "locale" is GBK --
# a UTF-8 file containing Chinese comments dies with UnicodeDecodeError before
# any of our code runs. Chinese explanations live in alembic/env.py instead.
#
# Also note: sqlalchemy.url is intentionally NOT set here. alembic/env.py takes
# the DSN from app.core.config, so migrations and the application can never
# silently point at different databases.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# Run ruff format over each generated migration so hand-editing indentation
# is never necessary.
#
# type must be "exec", not "console_scripts": alembic resolves
# console_scripts.ruff via importlib.metadata entry points, and ruff is not
# installed that way in this venv (it ships as a bare executable), so the hook
# fails with "Could not find entrypoint console_scripts.ruff" -- and a failing
# post-write hook makes alembic report the whole revision as FAILED even though
# the migration file was written correctly.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
